#
# picom.conf — snappy/zen config for picom v13
# (~/.config/picom/picom.conf didn't exist yet, so this is a fresh file,
#  not a merge with anything you had before)
#
# Test it standalone first, without touching your autostart script:
#   picom --config ~/.config/picom/picom.conf --show-all-xerrors
# Ctrl+C to stop it. If it starts cleanly, your autostart's plain `picom &`
# will pick this file up automatically — it lives at picom's default path.
#

### Backend / performance ###
backend = "glx";
vsync = true;
# Stop compositing while a fullscreen window (game, video) covers the screen.
unredir-if-possible = true;
use-damage = true;

### Shadows — soft, not heavy (per-window overrides are in `rules` below) ###
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -12;

### Fading — fast, not the sluggish default ###
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 4;

### Corners — subtle rounding, part of the zen look ###
corner-radius = 6;

### Background blur — this is what makes a transparent kitty look   ###
### frosted instead of just showing a flat cut-out of the desktop.  ###
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;

### Animations — short durations = snappy. Raise the "duration"     ###
### numbers (seconds) if you ever want them slower/more noticeable. ###
animations = (
  {
    triggers = [ "open" ];
    preset = "appear";
    scale = 0.97;
    duration = 0.12;
  },
  {
    triggers = [ "close" ];
    preset = "disappear";
    scale = 0.97;
    duration = 0.10;
  },
  {
    triggers = [ "show" ];
    preset = "appear";
    scale = 0.97;
    duration = 0.12;
  },
  {
    triggers = [ "hide" ];
    preset = "disappear";
    scale = 0.97;
    duration = 0.10;
  },
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.10;
  }
);

# Modern per-window overrides. (Using this instead of the older
# shadow-exclude/blur-background-exclude/wintypes options, since picom
# ignores those — with a warning — once `rules` is in use.)
rules = (
  # games: bypass the compositor entirely (no vsync/blur/extra frame of latency)
  { match = "class_g = 'cs2' || class_g = 'steam_app_730'"; unredir = "forced"; shadow = false; fade = false; corner-radius = 0; blur-background = false; animations = (); },
  # dwm's own bar and dmenu should be flat and instant, not animated boxes
  { match = "class_g = 'dwm'";   shadow = false; fade = false; corner-radius = 0; blur-background = false; },
  { match = "class_g = 'dmenu'"; shadow = false; fade = false; corner-radius = 0; blur-background = false; },

  { match = "window_type = 'dock'"; shadow = false; },
  { match = "window_type = 'dnd'";  shadow = false; },
  { match = "window_type = 'tooltip'"; shadow = false; opacity = 0.95; },
  { match = "window_type = 'popup_menu'"; opacity = 0.98; },
  { match = "window_type = 'dropdown_menu'"; opacity = 0.98; }
);
